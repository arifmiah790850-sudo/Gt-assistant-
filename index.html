<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GT Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b18;color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:25px 20px}
header{text-align:center;font-size:25px;letter-spacing:5px;color:#35c8ff;margin-top:20px}
.status{text-align:center;color:#8baac4;font-size:12px;margin-top:12px}
.core{width:190px;height:190px;border-radius:50%;margin:65px auto 30px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1262a0,#07152e 65%);border:2px solid #21baff;box-shadow:0 0 35px #087bca,inset 0 0 30px #087bca;animation:pulse 3s infinite}
.core span{font-size:48px;color:#62d9ff}
@keyframes pulse{50%{box-shadow:0 0 65px #087bca,inset 0 0 40px #087bca}}
h2{text-align:center;font-weight:400}
#messages{height:190px;overflow:auto;margin-top:25px;background:#0b1628;border:1px solid #173552;border-radius:15px;padding:12px}
.msg{margin:9px 0;font-size:14px;line-height:1.5}
.you{color:#55caff}.gt{color:#fff}
.controls{display:flex;justify-content:center;gap:12px;margin:25px;flex-wrap:wrap}
button{border:0;border-radius:50px;padding:15px 25px;background:#087dc4;color:white;font-size:16px;box-shadow:0 0 20px #087dc4}
button.stop{background:#a52d42}
select{background:#0b1628;color:white;border:1px solid #21baff;border-radius:10px;padding:10px}
footer{text-align:center;color:#56738d;font-size:11px}
</style>
</head>
<body>
<div class="app">
<header>GT ASSISTANT</header>
<div class="status" id="status">GT SYSTEM READY</div>
<div class="core"><span>GT</span></div>
<h2>Talk with GT</h2>
<div style="text-align:center">
<select id="language">
<option value="bn-IN">বাংলা</option>
<option value="hi-IN">हिन्दी</option>
<option value="en-US">English</option>
</select>
</div>
<div id="messages">
<div class="msg gt">GT: Hello Boss! I am ready.</div>
</div>
<div class="controls">
<button id="startButton">🎙 Start Live</button>
<button id="stopButton" class="stop">Stop</button>
</div>
<footer>YOUR PERSONAL AI ASSISTANT</footer>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
