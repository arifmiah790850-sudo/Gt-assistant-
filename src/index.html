<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GT Assistant</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#050b18;color:white;
font-family:Arial,sans-serif;min-height:100vh;
display:flex;justify-content:center;
}
.app{width:100%;max-width:480px;padding:25px 20px}
header{text-align:center;font-size:25px;
letter-spacing:5px;color:#35c8ff;margin-top:20px}
.status{text-align:center;color:#8baac4;
font-size:12px;margin-top:12px}
.core{
width:190px;height:190px;border-radius:50%;
margin:65px auto 30px;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle,#1262a0,#07152e 65%);
border:2px solid #21baff;
box-shadow:0 0 35px #087bca, inset 0 0 30px #087bca;
animation:pulse 3s infinite;
}
.core span{font-size:48px;color:#62d9ff}
@keyframes pulse{
50%{box-shadow:0 0 65px #087bca, inset 0 0 40px #087bca}
}
h2{text-align:center;font-weight:400}
#messages{
height:190px;overflow:auto;margin-top:25px;
background:#0b1628;border:1px solid #173552;
border-radius:15px;padding:12px;
}
.msg{margin:9px 0;font-size:14px;line-height:1.5}
.you{color:#55caff}
.gt{color:#fff}
.controls{display:flex;justify-content:center;margin:25px}
button{
border:0;border-radius:50px;padding:17px 35px;
background:#087dc4;color:white;font-size:16px;
box-shadow:0 0 20px #087dc4;
}
footer{text-align:center;color:#56738d;font-size:11px}
</style>
</head>
<body>
<div class="app">
<header>GT ASSISTANT</header>
<div class="status" id="status">PERSONAL AI SYSTEM</div>
<div class="core"><span>GT</span></div>
<h2>How can I help you?</h2>
<div id="messages">
<div class="msg gt">GT: Hello! I am GT, your personal assistant.</div>
</div>
<div class="controls">
<button onclick="startGT()">🎙 Talk to GT</button>
</div>
<footer>YOUR PERSONAL AI ASSISTANT</footer>
</div>
<script>
function addMessage(who,msg){
const box=document.getElementById("messages");
const div=document.createElement("div");
div.className="msg "+who.toLowerCase();
div.textContent=who+": "+msg;
box.appendChild(div);
box.scrollTop=box.scrollHeight;
}
function speak(text){
if(!window.speechSynthesis)return;
let u=new SpeechSynthesisUtterance(text);
u.lang="en-IN";
speechSynthesis.speak(u);
}
function startGT(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
document.getElementById("status").textContent="VOICE ENGINE NOT AVAILABLE";
return;
}
const rec=new SR();
rec.lang="en-IN";
rec.onstart=()=>document.getElementById("status").textContent="LISTENING...";
rec.onresult=e=>{
let text=e.results[0][0].transcript;
addMessage("YOU",text);
let reply="Yes Boss. I heard you say "+text;
addMessage("GT",reply);
speak(reply);
};
rec.onerror=()=>document.getElementById("status").textContent="VOICE ERROR";
rec.onend=()=>document.getElementById("status").textContent="SYSTEM READY";
rec.start();
}
</script>
</body>
</html>
